# Site configuration for https://penpaperkeycode.github.io (Jekyll on GitHub Pages).
# `jekyll serve` does NOT reload this file automatically: restart the server after editing it.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" # "default" (light) or "dark"; visitors can still toggle
title                    : "Jeonghoon Kim"
title_separator          : "-"
name                     : &name "Jeonghoon Kim"
description              : &description "Research scientist and team lead at NAVER Cloud, working on large-scale foundation models."
url                      : "https://penpaperkeycode.github.io"
baseurl                  : ""
repository               : "penpaperkeycode/penpaperkeycode.github.io"

# Site Author — rendered by _includes/home/profile.html (photo, name, bio, employer, location, links).
# A blank field hides its link. The profile shows: avatar, name, pronouns, bio, employer, location,
# uri, email, googlescholar, semantic, orcid, arxiv, researchgate, github, linkedin, twitter,
# bluesky, mastodon and youtube.
author:
  # Biographic information
  avatar           : "profile-portrait.jpg"
  name             : "Jeonghoon Kim"
  pronouns         : # example: "she/her"  
  bio              : "Team Lead"
  location         : "South Korea"
  employer         : "NAVER Cloud"
  uri              : # URL
  email            : "jeonghoon.samuel@gmail.com" 

  # Academic websites
  academia         : # URL
  arxiv            : # URL - Update with the correct link to your profile
  googlescholar    : "https://scholar.google.com/citations?user=IUXo_qcAAAAJ&hl=en"
  impactstory      : # URL
  orcid            : # "http://orcid.org/yourorcidurl"
  semantic         : # URL
  pubmed           : #"https://www.ncbi.nlm.nih.gov/pubmed/?term=john+snow"
  researchgate     : # URL
  scopus           : # URL

  # Repositories and software development
  bitbucket        : # Username - Update with your username on the site
  codepen          : # Username
  dribbble         : # Username
  github           : # "penpaperkeycode"
  kaggle           : # Username  
  stackoverflow    : # User number or user number and name (i.e., use "1" or "1/jeff-atwood")    

  # Social media
  bluesky          : # "bsky.app" # Replace this with you Bluesky username
  facebook         : # Username
  flickr           : # Username
  foursquare       : # Username
  goodreads        : # Username
  google_plus      : # Username
  keybase          : # Username
  instagram        : # Username
  lastfm           : # Username
  linkedin         : "jeonghoon-samuel-kim"
  mastodon         : # URL
  medium           : # URL
  pinterest        : # Username
  soundcloud       : # Username
  steam            : # Username
  telegram         : # URL
  tumblr           : # Username
  twitter          : # Username for X / Twitter
  vine             : # Username
  weibo            : # Username
  wikipedia        : # Username
  xing             : # Username
  youtube          : # Username
  zhihu            : # Username


# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# Social Sharing
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "profile-square.jpg" # default image for link previews (in /images/)
og_description           : "Research scientist and team lead at NAVER Cloud, working on large-scale foundation models."
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles


# Analytics
analytics:
  provider               : "false" # false (default), "google", "google-universal", "google-analytics-4", "custom"
  google:
    tracking_id          :


# Reading Files
include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - CLAUDE.md
  - docker-compose.yaml
  - Dockerfile
  - Gemfile
  - LICENSE
  - local
  - node_modules
  - package.json*
  - README
  - tmp
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Pages use the homepage layout (profile + content) unless they set their own
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: home


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC


# Plugins (all supported by GitHub Pages)
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from


# HTML Compression
# - http://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development
