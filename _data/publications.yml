# Publications (homepage section, rendered by _includes/home/publications.html)
#
# HOW TO ADD A PAPER
#   1. Copy an existing entry: from its "- id:" line down to the line before the next "- id:".
#   2. Paste it into "lead:" or "coauthor:" where it should appear (papers are shown top to bottom).
#   3. Edit the values. Keep the double quotes around every value.
#   Numbers (1, 2, 3, ...) are assigned automatically: lead papers first, then co-author papers,
#   and the [N] references under Work Experience follow automatically.
#
# FIELDS
#   id       short unique name (letters, digits, _). Work Experience cites papers by this id.
#   title    paper title, no trailing period
#   url      link opened by the title (the official paper page if there is one, else arXiv)
#   authors  author list as it should appear; "*" marks equal contribution.
#            Names listed under "highlight:" below are shown in bold automatically.
#   venue    e.g. "ICML 2025" or "Arxiv (preprint, 2025)". Venues containing "Technical report"
#            get a teal badge, other venues containing "Arxiv" a grey one, all others blue.
#   corresponding  (optional) true when Jeonghoon Kim is a (co-)corresponding author of a
#            co-author paper; a † is shown after his name (legend: †corresponding author).
#            Not used for first / co-first author papers (lead:), by choice.
#   note     (optional) short remark shown next to the venue, e.g. "Corresponding author."
#   links    (optional) buttons shown under the authors, each with a label and a url.
#            Use the labels "Paper", "arXiv", "Code" or "Model":
#              links:
#                - label: "Code"
#                  url: "https://github.com/..."
#
# A double quote inside a value must be written as \"  (example: "Say \"I Don't Know\"").
# If the site stops updating after an edit, open the repository's Actions tab: a red
# "pages build and deployment" run means a typo here (usually a missing quote or space).

# TEMPLATE — copy these lines into "lead:" or "coauthor:", delete the leading "# " on each line,
# then fill in the values (delete optional lines you don't need):
#   - id: new_paper_id
#     title: "Paper Title"
#     url: "https://..."
#     authors: "First Author*, Jeonghoon Kim*, Third Author"
#     venue: "Conference 2027"
#     note: "Optional remark."
#     links:
#       - label: "Paper"
#         url: "https://..."
#       - label: "arXiv"
#         url: "https://arxiv.org/abs/..."
#       - label: "Code"
#         url: "https://github.com/..."
# Every paper starts with "- id:" at the same indentation as the other papers.

