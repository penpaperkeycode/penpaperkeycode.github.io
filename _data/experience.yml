# Work Experience (homepage timeline, rendered by _includes/home/experience.html). Newest first.
#
# HOW TO ADD A BULLET
#   Add a line under the job's "items:", indented like the others:
#       - "2026: Short description of the milestone."
#   Text may contain Markdown: **bold** and links such as [NAVER](https://www.navercorp.com/en)
#   To link a word to a paper in the Publications list, use the paper's id after #pub:
#   [2024](#pub:hcx_tr) becomes a link to that paper's current number (an unknown id shows ??).
#
#   To cite papers from _data/publications.yml, use the two-line form instead
#   ("papers" lists paper ids; they are shown as linked numbers such as [1, 2, 3]):
#       - text: "(Current) Pre-training dynamics & Transformer architecture"
#         papers: [unigram_lens, peri_ln, vocab_imbalance]
#   A sub-bullet goes under "sub:" of a two-line item (see the NAVER Cloud items below).
#
#   "about:" (optional) is a one-line description of the company, shown under its name.
#   "items_label:" (optional) shows a small heading such as FOCUS AREAS above the bullets.
#   "earlier:" (optional) is a second list in the same format, shown under EARLIER WORK
#   ("earlier_label:" renames that heading).
#
# HOW TO ADD A PROMOTION
#   Promotions go under the job's "promotions:", NEWEST FIRST (the highest year always gets the
#   highlighted dot, but the list is shown in the order written). They are shown below the
#   bullets, under the heading PROMOTIONS, as a small timeline (title, year, team).
#   Copy these three lines to the top of the list and edit them ("team" is optional):
#       - year: "2026"
#         title: "New Title"
#         team: "Team Name, Division Name"
#   In a current job (period contains "Present") the newest promotion gets the highlighted dot.
#
# HOW TO ADD A JOB
#   Copy a block from its "- org:" line down to the line before the next "- org:",
#   paste it at the top of the list and edit it.
#   "items_label:", "items:" and "promotions:" are optional; delete the ones you don't need.
#   A job whose period contains "Present" gets the highlighted (current) dot.
#
# Keep the double quotes around every text value. Without them, a bullet such as
#   - 2026: Started ...      (no quotes, contains ": ")
# is read as a key/value pair. The page still shows such a bullet correctly, but other unquoted
# text (for example a value starting with "[" or containing ": [") stops the build, so always quote.
#
# TEMPLATE — copy to the top of the list, delete the leading "# " on each line, then edit:
# - org: "Company"
#   period: "Jan.2027 - Present"
#   about: "One line about the company."
#   role: "Team, Title"
#   items_label: "Research"
#   items:
#     - "Plain bullet."
#     - text: "Bullet that cites papers"
#       papers: [peri_ln, lrq]
#   earlier:
#     - "Bullet about earlier work."
#   promotions:
#     - year: "2028"
#       title: "New Title"
#       team: "Team Name, Division Name"
#
# If the site stops updating after an edit, open the repository's Actions tab: a red
# "pages build and deployment" run means a typo here (usually a missing quote or space).

